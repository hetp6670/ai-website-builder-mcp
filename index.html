<!DOCTYPE html>
<html>
<head>
  <title>My Cool Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      background: rgba(0,0,0,0.3);
    }

    .hero {
      margin-top: 80px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      opacity: 0.8;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      background: #ff9800;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #e68900;
      transform: scale(1.05);
    }

    footer {
      position: fixed;
      bottom: 10px;
      width: 100%;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

<header>
  🚀 My First Cool Website
</header>

<div class="hero">
  <h1>Welcome 🔥</h1>
  <p>This website is powered by backend + AI</p>

  <button onclick="getMessage()">Click Me</button>

  <p id="msg"></p>
</div>

<footer>
  Made by YOU 😎
</footer>

<script>
  async function getMessage() {
    const res = await fetch('/api/message');
    const data = await res.json();
    document.getElementById('msg').innerText = data.text;
  }
</script>

</body>
  </html>
